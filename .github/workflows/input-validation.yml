name: LabInsight input validation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application syntax
        run: node --check app.js && node --check ocr-review.js && node --check reference-ranges.js
      - name: Run regression tests
        run: node --test tests/*.test.js
