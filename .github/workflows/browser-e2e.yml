name: LabInsight browser smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-user-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --prefix tests/browser --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and dependencies
        run: ./tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser integration tests
        run: node --test tests/browser/user-flows.test.cjs
