name: LabInsight public Pages handoff audit (anonymous)

on:
  workflow_dispatch:
  # One low-volume anonymous GET audit daily (08:17 Asia/Seoul).
  # Schedule is best effort; this job never deploys or reads user health data.
  schedule:
    - cron: '17 23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-pages-handoff-audit.yml'
      - 'scripts/check-public-pages-handoff.mjs'
      - 'tests/public-pages-handoff-audit.test.js'

permissions:
  contents: read

jobs:
  public-boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test anonymous audit using synthetic HTTP responses
        run: node --test tests/public-pages-handoff-audit.test.js
      - name: Check live old Pages URLs, approved Worker and public Caffeine Atlas
        run: node scripts/check-public-pages-handoff.mjs
